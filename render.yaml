services:
  - type: web
    name: dl-extractor
    env: node
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && export PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.cache/playwright && npm install && npx playwright install chromium chromium-headless-shell && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
